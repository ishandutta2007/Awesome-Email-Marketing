<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Vibrant Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15" />
    </linearGradient>

    <!-- Glow Circle Gradient -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="100" r="250" fill="url(#glow-cyan)" />
  <circle cx="1000" cy="300" r="280" fill="url(#glow-purple)" />

  <!-- Grid Pattern Overlay -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Decorative Flow Wave Line -->
  <path d="M 50 300 Q 350 380 650 300 T 1150 320" fill="none" stroke="#6366f1" stroke-width="2.5" opacity="0.3" stroke-dasharray="10 6" />

  <!-- Vector Envelope Illustration Right Side -->
  <g transform="translate(900, 110)">
    <!-- Outer Card -->
    <rect width="220" height="150" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
    <!-- Flap Path -->
    <path d="M 10 15 L 110 90 L 210 15" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner Accent Lines -->
    <line x1="30" y1="110" x2="110" y2="110" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="125" x2="80" y2="125" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <circle cx="180" cy="115" r="14" fill="#38bdf8" opacity="0.2" />
    <path d="M 174 115 L 178 119 L 186 111" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Left Accent Envelope Vector -->
  <g transform="translate(60, 260)" opacity="0.5">
    <rect width="130" height="85" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <path d="M 8 10 L 65 50 L 122 10" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND BRANDING CONTENT -->
  <!-- Top Badge Pill -->
  <g transform="translate(80, 70)">
    <rect width="250" height="38" rx="19" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Envelope Icon Path -->
    <path d="M 22 14 L 38 14 C 40 14 41 15 41 17 L 41 27 C 41 29 40 30 38 30 L 22 30 C 20 30 19 29 19 27 L 19 17 C 19 15 20 14 22 14 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 19 17 L 30 24 L 41 17" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <text x="50" y="24" fill="#38bdf8" font-family="ui-sans-serif, system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">CURATED RESOURCE DIRECTORY</text>
  </g>

  <!-- Title Text -->
  <text x="80" y="175" fill="url(#title-grad)" font-family="ui-sans-serif, system-ui, -apple-system, Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-0.5">Awesome Email Marketing</text>

  <!-- Subtitle Text -->
  <text x="80" y="220" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Roboto, sans-serif" font-size="21" font-weight="500">Top SaaS Email Platforms &amp; Self-Hosted Open-Source Infrastructure</text>

  <!-- Feature Tags Row -->
  <g transform="translate(80, 260)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="18" y="22" fill="#38bdf8" font-family="ui-sans-serif, system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="600">SaaS Platforms</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(175, 0)">
      <rect width="185" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="18" y="22" fill="#818cf8" font-family="ui-sans-serif, system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="600">Open-Source Engines</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(375, 0)">
      <rect width="210" height="34" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <text x="18" y="22" fill="#c084fc" font-family="ui-sans-serif, system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="600">Developer APIs &amp; Delivery</text>
    </g>
  </g>
</svg>
