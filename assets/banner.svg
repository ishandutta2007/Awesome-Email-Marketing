<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes flow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .bg-shape-1 {
      animation: pulse 6s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-icon {
      animation: float 5s ease-in-out infinite;
    }
    .floating-icon-delayed {
      animation: float 7s ease-in-out infinite 1.5s;
    }
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 56px;
      fill: url(#text-grad);
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Dark Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Dynamic Background Elements (Kept in Background) -->
  <g class="bg-shape-1">
    <circle cx="150" cy="100" r="180" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
    <circle cx="1050" cy="300" r="220" fill="#818cf8" opacity="0.08" filter="url(#glow)" />
  </g>

  <!-- Decorative Flow Line -->
  <path d="M 50 320 Q 300 380 600 320 T 1150 340" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3" stroke-dasharray="8 8" />

  <!-- Background Floating Mail Cards (Behind Foreground Text) -->
  <g class="floating-icon-delayed" opacity="0.25">
    <rect x="920" y="60" width="200" height="120" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 940 90 L 1020 135 L 1100 90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <g class="floating-icon" opacity="0.2">
    <rect x="80" y="240" width="160" height="100" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <path d="M 100 265 L 160 300 L 220 265" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Always Visible & Unobstructed) -->
  <g transform="translate(80, 150)">
    <!-- Email Icon pill -->
    <g transform="translate(0, -65)">
      <rect width="210" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="18" y="23" class="badge-text">📧 Awesome Resource List</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="25" class="title-text" filter="url(#glow)">Awesome Email Marketing 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="70" class="subtitle-text">Curated Ecosystem of Top SaaS Platforms & Open-Source Email Solutions</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 110)">
      <rect width="170" height="32" rx="8" fill="#334155" opacity="0.8" />
      <text x="16" y="21" class="badge-text" fill="#38bdf8">⚡ SaaS Solutions</text>

      <rect x="185" width="200" height="32" rx="8" fill="#334155" opacity="0.8" />
      <text x="201" y="21" class="badge-text" fill="#818cf8">🔓 Open-Source Engines</text>

      <rect x="400" width="190" height="32" rx="8" fill="#334155" opacity="0.8" />
      <text x="416" y="21" class="badge-text" fill="#c084fc">📊 Analytics & Delivery</text>
    </g>
  </g>
</svg>
